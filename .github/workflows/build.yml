name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - master
      - recovery/qsn-ref-stage1
      - feat/qsn-3d-smart-stage1

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "29.0.14206865"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh
    
    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v5.7.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Decode Keystore
      uses: timheuer/base64-to-file@v2.0.0
      id: android_keystore
      with:
        fileName: "android_keystore.jks"
        encodedString: ${{ secrets.APP_KEYSTORE_BASE64 }}

    - name: Run Unit Tests
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        set +e
        ./gradlew testPlaystoreDebugUnitTest --no-daemon > unit-test.log 2>&1
        status=$?
        tail -n 80 unit-test.log
        if [ $status -ne 0 ]; then
          while IFS= read -r line; do echo "::error::$line"; done < <(grep -E "^e: |FAILED|not mocked|Execution failed|error:|Caused by|AssertionError" unit-test.log | head -n 30)
          while IFS= read -r line; do echo "::error::$line"; done < <(grep -ho 'message="[^"]*"' app/build/test-results/testPlaystoreDebugUnitTest/*.xml 2>/dev/null | head -n 20)
          exit $status
        fi
        python3 - <<'PY'
import glob, xml.etree.ElementTree as ET
total = failed = skipped = 0
for f in glob.glob("app/build/test-results/testPlaystoreDebugUnitTest/*.xml"):
    r = ET.parse(f).getroot()
    total += int(r.attrib.get("tests", 0))
    failed += int(r.attrib.get("failures", 0)) + int(r.attrib.get("errors", 0))
    skipped += int(r.attrib.get("skipped", 0))
print(f"::notice::Unit tests summary: total={total}, passed={total-failed-skipped}, failed={failed}, skipped={skipped}")
PY

    - name: Build APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew licenseFdroidReleaseReport
        ./gradlew assembleRelease -Pandroid.injected.signing.store.file=${{ steps.android_keystore.outputs.filePath }} -Pandroid.injected.signing.store.password=${{ secrets.APP_KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.APP_KEYSTORE_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.APP_KEY_PASSWORD }}

    - name: Verify APK signature and upgrade compatibility
      run: |
        set -euo pipefail
        cd ${{ github.workspace }}/V2rayNG
        BUILD_TOOLS=$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n 1)
        APK="app/build/outputs/apk/playstore/release/QuietStormNG_2.4.0_arm64-v8a.apk"
        test -f "${APK}"
        badging=$("${BUILD_TOOLS}/aapt2" dump badging "${APK}")
        line=$(printf '%s\n' "${badging}" | awk 'NR==1')
        echo "${line}"
        echo "${line}" | grep -q "name='com.quietstorm.ng'"
        echo "${line}" | grep -q "versionCode='4000746'"
        certs=$("${BUILD_TOOLS}/apksigner" verify --print-certs "${APK}" 2>&1)
        printf '%s\n' "${certs}"
        cert_sha256=$(printf '%s\n' "${certs}" | sed -n 's/.*SHA-256 digest: *//p' | tr -d ' \r' | awk 'NR==1')
        echo "Cert SHA-256: ${cert_sha256}"
        test "${cert_sha256}" = "a016c9bf4d8e7341efd565f7fc1959235fcdf74c63feb1e31dbaee86a9c22ae1"
        apk_sha256=$(sha256sum "${APK}" | awk '{print $1}')
        echo "::notice::Verified APK=${APK} sha256=${apk_sha256} cert=${cert_sha256} ${line}"
    
    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: arm64-v8a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*arm64-v8a*.apk

    - name: Upload armeabi-v7a APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: armeabi-v7a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*armeabi-v7a*.apk

    - name: Upload x86 APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: x86-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*x86*.apk

    - name: Upload universal APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: universal-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*universal*.apk

  sign-and-release:
    needs: build
    runs-on: ubuntu-26.04
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          path: release

      - name: Sign APK files
        run: |
          printf '%s' "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          mkdir -p release-files

          find release -type f -name '*.apk' | while read apk; do
            cp "$apk" release-files/
            gpg --batch --yes --local-user "$KEY" --detach-sign --output "release-files/$(basename "$apk").sig" "$apk"
          done

          gpg --armor --export "$KEY" > release-files/v2rayN-public-key.asc

      - name: Upload APKs, signatures and public key to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: release-files/*
          tag: ${{ inputs.release_tag }}
          file_glob: true
          prerelease: true
