name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - main
      - master
      - recovery/qsn-ref-stage1
      - feat/qsn-3d-smart-stage1
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/cleanup-runs.yml'
      - 'LICENSE*'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "29.0.14206865"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh
    
    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v5.7.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Decode Keystore
      uses: timheuer/base64-to-file@v2.0.0
      id: android_keystore
      with:
        fileName: "android_keystore.jks"
        encodedString: ${{ secrets.APP_KEYSTORE_BASE64 }}

    - name: Run Unit Tests
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        set +e
        ./gradlew testPlaystoreDebugUnitTest --no-daemon > unit-test.log 2>&1
        status=$?
        tail -n 80 unit-test.log
        if [ $status -ne 0 ]; then
          while IFS= read -r line; do echo "::error::$line"; done < <(grep -E "^e: |FAILED|not mocked|Execution failed|error:|Caused by|AssertionError" unit-test.log | head -n 30)
          while IFS= read -r line; do echo "::error::$line"; done < <(grep -ho 'message="[^"]*"' app/build/test-results/testPlaystoreDebugUnitTest/*.xml 2>/dev/null | head -n 20)
          exit $status
        fi
        python3 -c 'import glob, xml.etree.ElementTree as ET; roots = [ET.parse(f).getroot() for f in glob.glob("app/build/test-results/testPlaystoreDebugUnitTest/*.xml")]; t = sum(int(r.attrib.get("tests", 0)) for r in roots); f = sum(int(r.attrib.get("failures", 0)) + int(r.attrib.get("errors", 0)) for r in roots); s = sum(int(r.attrib.get("skipped", 0)) for r in roots); print(f"::notice::Unit tests summary: total={t}, passed={t-f-s}, failed={f}, skipped={s}")'

    - name: Upload UI screenshots
      uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: ui-screenshots
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/screenshots/*.png
        retention-days: 7
        if-no-files-found: ignore

    - name: Build APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew licensePlaystoreReleaseReport
        ./gradlew assemblePlaystoreRelease -Pandroid.injected.signing.store.file=${{ steps.android_keystore.outputs.filePath }} -Pandroid.injected.signing.store.password=${{ secrets.APP_KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.APP_KEYSTORE_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.APP_KEY_PASSWORD }}

    - name: Verify APK signature and upgrade compatibility
      run: |
        set -euo pipefail
        cd ${{ github.workspace }}/V2rayNG
        if find app/build/outputs/apk -iname '*fdroid*' | grep -q .; then
          echo "::error::F-Droid builds are forbidden in NovaPulse releases"
          exit 1
        fi
        BUILD_TOOLS=$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n 1)
        APK="app/build/outputs/apk/playstore/release/NovaPulse_2.6.2_arm64-v8a.apk"
        test -f "${APK}"
        test -f "app/build/outputs/mapping/playstoreRelease/mapping.txt"
        badging=$("${BUILD_TOOLS}/aapt2" dump badging "${APK}")
        line=$(printf '%s\n' "${badging}" | awk 'NR==1')
        echo "${line}"
        echo "${line}" | grep -q "name='com.quietstorm.ng'"
        echo "${line}" | grep -q "versionCode='4000758'"
        certs=$("${BUILD_TOOLS}/apksigner" verify --print-certs "${APK}" 2>&1)
        printf '%s\n' "${certs}"
        cert_sha256=$(printf '%s\n' "${certs}" | sed -n 's/.*SHA-256 digest: *//p' | tr -d ' \r' | awk 'NR==1')
        echo "Cert SHA-256: ${cert_sha256}"
        test "${cert_sha256}" = "a016c9bf4d8e7341efd565f7fc1959235fcdf74c63feb1e31dbaee86a9c22ae1"
        apk_sha256=$(sha256sum "${APK}" | awk '{print $1}')
        echo "::notice::Verified APK=${APK} sha256=${apk_sha256} cert=${cert_sha256} ${line}"
    
    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: arm64-v8a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/release/*arm64-v8a*.apk
        retention-days: 7

    - name: Upload armeabi-v7a APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: armeabi-v7a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/release/*armeabi-v7a*.apk
        retention-days: 7

    - name: Upload x86_64 APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: x86_64
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/release/*x86_64*.apk
        retention-days: 7

    - name: Upload x86 APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: x86-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/release/*_x86.apk
        retention-days: 7

    - name: Upload universal APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: universal-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/release/*universal*.apk
        retention-days: 7

  sign-and-release:
    needs: build
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          path: release

      - name: Prepare release assets & checksums
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          mkdir -p release-files
          find release -type f -name '*.apk' ! -iname '*fdroid*' -exec cp {} release-files/ \;
          (cd release-files && sha256sum *.apk > SHA256SUMS.txt)
          if [ -n "$GPG_KEY" ]; then
            printf '%s' "$GPG_KEY" | gpg --batch --import
            KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
            for apk in release-files/*.apk; do
              gpg --batch --yes --local-user "$KEY" --detach-sign --output "${apk}.sig" "$apk"
            done
            gpg --armor --export "$KEY" > release-files/novapulse-public-key.asc
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-files/* --clobber
          else
            gh release create "$TAG" release-files/* \
              --title "NovaPulse ${TAG}" \
              --notes "⚠️ به‌روزرسانی الزامی و امنیتی NovaPulse (${TAG}): برای حفظ اتصال پایدار، پشتیبانی از نشست امن دستگاه و جلوگیری از قطع دسترسی نسخه‌های قدیمی، لطفاً حتماً اپلیکیشن را به این نسخه به‌روزرسانی کنید. (Official Standard & Universal APKs: ARM64, ARMv7, x86_64, x86, Universal)"
          fi
