name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - master
      - feature/minimal-cloudflare-vpn
    paths:
      # Run the Android build + app tests only when the application or a
      # build-critical input changes. Documentation-only changes (CLAUDE.md,
      # Report.md, README and other Markdown files) must not trigger a build.
      - 'V2rayNG/**'              # app source, resources, manifests, tests, Gradle config
      - 'AndroidLibXrayLite/**'   # Xray core binding (submodule tree)
      - 'AndroidLibXrayLite'      # Xray core binding (submodule pointer bump)
      - 'hev-socks5-tunnel/**'    # native tunnel source (submodule tree)
      - 'hev-socks5-tunnel'       # native tunnel source (submodule pointer bump)
      - 'compile-hevtun.sh'       # native library build script
      - '.gitmodules'             # core integration wiring
      - '.github/workflows/build.yml' # this workflow, so its own changes are verified
      - '.github/scripts/**'      # build support scripts

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "29.0.14206865"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh
    
    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v5.7.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Decode Keystore
      uses: timheuer/base64-to-file@v2.0.0
      id: android_keystore
      with:
        fileName: "android_keystore.jks"
        encodedString: ${{ secrets.APP_KEYSTORE_BASE64 }}

    - name: Run unit tests
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        set +e
        ./gradlew testPlaystoreDebugUnitTest \
          --tests "com.v2ray.ang.ui.connect.*" \
          --tests "com.v2ray.ang.ui.qsn.*" \
          --tests "com.v2ray.ang.ui.qsn.domain.*" \
          --tests "com.v2ray.ang.ui.qsn.data.*" > unit-test.log 2>&1
        status=$?
        tail -n 60 unit-test.log
        if [ $status -ne 0 ]; then
          while IFS= read -r line; do echo "::error::$line"; done < <(grep -E "^e: |FAILED|not mocked|Execution failed|error:|Caused by" unit-test.log | head -n 25)
          # The assertion message itself, so a failure is diagnosable from the
          # annotations without downloading the job log.
          while IFS= read -r line; do echo "::error::$line"; done < <(grep -ho 'message="[^"]*"' app/build/test-results/testPlaystoreDebugUnitTest/*.xml 2>/dev/null | head -n 20)
          exit $status
        fi
        python3 ${{ github.workspace }}/.github/scripts/summarize-unit-tests.py app/build/test-results/testPlaystoreDebugUnitTest
    - name: Build APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew licensePlaystoreReleaseReport
        ./gradlew assemblePlaystoreRelease -Pandroid.injected.signing.store.file=${{ steps.android_keystore.outputs.filePath }} -Pandroid.injected.signing.store.password=${{ secrets.APP_KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.APP_KEYSTORE_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.APP_KEY_PASSWORD }}
    
    - name: Verify APK identity, signature and features
      run: |
        set -euo pipefail
        cd ${{ github.workspace }}/V2rayNG

        BUILD_TOOLS=$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n 1)
        echo "build-tools: ${BUILD_TOOLS}"

        HEAD_SHA=$(git -C "${{ github.workspace }}" rev-parse HEAD)
        echo "source commit: ${HEAD_SHA}"
        test "${HEAD_SHA}" = "${GITHUB_SHA}"

        # No F-Droid output may exist anywhere in the build tree. The build
        # step only assembles the playstore variant, so this can only fire if
        # someone reintroduces a flavour-wide task.
        fdroid_files=$(find app/build/outputs/apk -type f -name '*-fdroid*' || true)
        if [ -n "${fdroid_files}" ]; then
          echo "::error::an F-Droid APK was produced by this build"
          echo "${fdroid_files}"
          exit 1
        fi

        fail=0
        signer=""
        for abi in arm64-v8a armeabi-v7a universal; do
          set -- app/build/outputs/apk/playstore/release/QuietStormNG_*_"${abi}".apk
          if [ "$#" -ne 1 ]; then
            echo "::error::expected exactly one ${abi} APK, found $#"
            ls -l app/build/outputs/apk/playstore/release || true
            exit 1
          fi
          apk="$1"
          if [ ! -f "${apk}" ]; then
            echo "::error::missing APK: ${apk}"
            ls -l app/build/outputs/apk/playstore/release || true
            exit 1
          fi
          echo "== ${apk}"

          badging=$("${BUILD_TOOLS}/aapt2" dump badging "${apk}")
          line=$(printf '%s\n' "${badging}" | awk 'NR==1')
          echo "   ${line}"
          case "${line}" in
            *"name='com.quietstorm.ng'"*) ;;
            *) echo "::error::unexpected package for ${apk}: ${line}"; fail=1 ;;
          esac

          set +e
          certs=$("${BUILD_TOOLS}/apksigner" verify --print-certs "${apk}" 2>&1)
          sign_status=$?
          set -e
          printf '%s\n' "${certs}" | sed 's/^/     /'
          if [ "${sign_status}" -ne 0 ]; then
            echo "::error::apksigner rejected ${apk}"
            fail=1
            continue
          fi
          cert=$(printf '%s\n' "${certs}" | sed -n 's/.*SHA-256 digest: *//p' | tr -d ' \r' | awk 'NR==1')
          if [ -z "${cert}" ]; then
            # The exit status already proved the signature is valid; keep the
            # whole report so the three APKs can still be compared exactly.
            cert=$(printf '%s\n' "${certs}" | tr '\n' ' ' | tr -s ' ')
          fi
          echo "   signer: ${cert}"
          if [ -z "${cert}" ]; then
            echo "::error::apksigner printed no signer information for ${apk}"
            fail=1
          elif [ -z "${signer}" ]; then
            signer="${cert}"
          elif [ "${signer}" != "${cert}" ]; then
            echo "::error::${apk} is signed by a different key"
            fail=1
          fi

          ranker=$(unzip -p "${apk}" 'classes*.dex' | grep -ac 'CandidateRanker' || true)
          ui=$(unzip -p "${apk}" 'classes*.dex' | grep -ac 'QsConfigScreen' || true)
          res=$(unzip -p "${apk}" resources.arsc | grep -ac 'Cloudflare-ready' || true)
          echo "   new-code markers: ranker=${ranker} ui=${ui} resources=${res}"
          if [ "${ranker}" -lt 1 ] || [ "${ui}" -lt 1 ] || [ "${res}" -lt 1 ]; then
            echo "::error::${apk} does not contain the new feature code"
            fail=1
          fi
        done

        if [ "${fail}" -ne 0 ]; then
          exit 1
        fi
        echo "all three APKs are com.quietstorm.ng, share one signing key and contain the new code"

    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: arm64-v8a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/release/QuietStormNG_*_arm64-v8a.apk
        if-no-files-found: error

    - name: Upload armeabi-v7a APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: armeabi-v7a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/release/QuietStormNG_*_armeabi-v7a.apk
        if-no-files-found: error

    - name: Upload universal APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: universal-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/release/QuietStormNG_*_universal.apk
        if-no-files-found: error

  sign-and-release:
    needs: build
    runs-on: ubuntu-26.04
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          path: release

      - name: Sign APK files
        run: |
          printf '%s' "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          mkdir -p release-files

          find release -type f -name '*.apk' | while read apk; do
            cp "$apk" release-files/
            gpg --batch --yes --local-user "$KEY" --detach-sign --output "release-files/$(basename "$apk").sig" "$apk"
          done

          gpg --armor --export "$KEY" > release-files/v2rayN-public-key.asc

      - name: Upload APKs, signatures and public key to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: release-files/*
          tag: ${{ inputs.release_tag }}
          file_glob: true
          prerelease: true
