name: Cleanup Old Runs

on:
  workflow_dispatch:
    inputs:
      max_runs:
        description: Maximum workflow runs to keep
        required: false
        default: '30'
      keep_artifact_builds:
        description: Number of recent successful Build APK runs to keep artifacts for
        required: false
        default: '2'
  push:
    branches:
      - feat/qsn-3d-smart-stage1
      - main
      - master
    paths:
      - '.github/workflows/cleanup-runs.yml'
  schedule:
    - cron: '0 4 * * *'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Prune old workflow runs and excess artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          MAX_RUNS: ${{ inputs.max_runs || '30' }}
          KEEP_ARTIFACT_BUILDS: ${{ inputs.keep_artifact_builds || '2' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          current_run_id = int(os.environ["CURRENT_RUN_ID"])
          max_runs = max(5, int(os.environ.get("MAX_RUNS", "30")))
          keep_artifact_builds = max(1, int(os.environ.get("KEEP_ARTIFACT_BUILDS", "2")))

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "novapulse-cleanup-bot",
          }

          def api(method, path):
              req = urllib.request.Request(f"https://api.github.com{path}", method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read()
                      return resp.status, json.loads(body) if body else {}
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")

          runs = []
          page = 1
          while True:
              status, data = api("GET", f"/repos/{repo}/actions/runs?per_page=100&page={page}")
              if status != 200:
                  raise RuntimeError(f"List runs failed: {status} {data}")
              batch = data.get("workflow_runs", [])
              if not batch:
                  break
              runs.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          runs.sort(key=lambda r: r.get("created_at", ""), reverse=True)
          print(f"Initial workflow runs count: {len(runs)}")

          active_or_current = [r for r in runs if r["id"] == current_run_id or r.get("status") != "completed"]
          active_ids = {r["id"] for r in active_or_current}
          completed = [r for r in runs if r["id"] not in active_ids]

          keep_completed_slots = max(0, max_runs - len(active_or_current))
          runs_to_keep = completed[:keep_completed_slots]
          runs_to_delete = completed[keep_completed_slots:]

          deleted_runs = 0
          for r in runs_to_delete:
              st, err = api("DELETE", f"/repos/{repo}/actions/runs/{r['id']}")
              if st in (200, 204):
                  deleted_runs += 1
              else:
                  print(f"Warn: delete run {r['id']} -> {st}: {err}")

          kept_ids = {r["id"] for r in runs_to_keep} | active_ids
          build_runs_kept_artifacts = [
              r["id"]
              for r in runs_to_keep
              if r.get("name") == "Build APK" and r.get("conclusion") == "success"
          ][:keep_artifact_builds]
          keep_artifacts_run_ids = set(build_runs_kept_artifacts) | active_ids

          # Prune artifacts on kept older/failed runs so free 500MB quota stays clean
          artifacts = []
          page = 1
          while True:
              status, data = api("GET", f"/repos/{repo}/actions/artifacts?per_page=100&page={page}")
              if status != 200:
                  print(f"Warn: list artifacts failed: {status} {data}")
                  break
              batch = data.get("artifacts", [])
              if not batch:
                  break
              artifacts.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          deleted_artifacts = 0
          remaining_bytes = 0
          for art in artifacts:
              wr_id = (art.get("workflow_run") or {}).get("id")
              if wr_id not in kept_ids:
                  continue  # already removed with run deletion
              if wr_id not in keep_artifacts_run_ids:
                  st, err = api("DELETE", f"/repos/{repo}/actions/artifacts/{art['id']}")
                  if st in (200, 204):
                      deleted_artifacts += 1
                  else:
                      remaining_bytes += art.get("size_in_bytes", 0)
                      print(f"Warn: delete artifact {art['id']} -> {st}: {err}")
              else:
                  remaining_bytes += art.get("size_in_bytes", 0)

          print(
              f"Cleanup done: deleted_runs={deleted_runs}, deleted_extra_artifacts={deleted_artifacts}, "
              f"kept_runs={len(kept_ids)}, kept_artifact_builds={build_runs_kept_artifacts}, "
              f"remaining_artifact_mb={remaining_bytes / 1024 / 1024:.1f}"
          )
          PY
